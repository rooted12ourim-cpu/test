<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      background: #FAF8F3; color: #2B2A26; font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif; }
    .card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #E7E2D6; border-radius: 8px; padding: 32px 24px; text-align: center; }
    .wordmark { font-size: 13px; font-weight: 600; color: #7A766C; }
    h1 { margin: 12px 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0; font-size: 15px; line-height: 22px; color: #7A766C; }
  </style>
</head>
<body>
  <main class="card">
    <div class="wordmark">rooted</div>
    <h1>접근 권한 없음</h1>
    <p>준성에게 계정 등록을 요청하세요.</p>
  </main>
</body>
</html>
